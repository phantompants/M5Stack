; AtomS3 USB bridge for the CardputerZero logger: ESP-NOW hub for the JP226
; accessories, plus the Atomic GPS Base NMEA when the Zero has no GPS Cap.
; See docs/zero-bridge.md.

[platformio]
default_envs = m5stack-atoms3

[env:m5stack-atoms3]
extra_scripts = pre:../shared/version.py
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = m5stack-atoms3
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv
; USB CDC is the link to the Zero, so core logging must stay off it.
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DCORE_DEBUG_LEVEL=0
  -I../shared
lib_deps =
  https://github.com/m5stack/M5Unified.git#0.2.22
  mikalhart/TinyGPSPlus@1.1.0
