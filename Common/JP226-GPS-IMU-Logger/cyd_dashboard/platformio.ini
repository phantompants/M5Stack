; "Cheap Yellow Display" (ESP32-2432S028R: ESP32, 2.8" ILI9341 320x240,
; XPT2046 touch) as a JP226 dashboard and waypoint remote. It pairs with a
; logger like the M5Dial; see docs/cyd-dashboard.md.

[platformio]
default_envs = cyd

[env:cyd]
extra_scripts = pre:../shared/version.py
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -I../shared
lib_deps =
  lovyan03/LovyanGFX@1.2.7
